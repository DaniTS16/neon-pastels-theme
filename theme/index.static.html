<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Neon Pastels — Static</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="assets/css/main.css">
    </head>
    <body class="np-theme np-light-default np-layout-Single np-motion-Brand np-palette-Pastel np-glow-Medium">
        <header class="np-header">
            <div class="np-header-inner">
                <span class="np-logo np-logo-static">Neon Pastels</span>
                <span class="np-logo np-logo-animated">Neon Pastels</span>
            </div>
        </header>
        <main class="np-main">
            <section class="np-blog-meta">
                <h1>Neon Pastels</h1>
                <p>Static preview of the Neon Pastels Tumblr theme.</p>
            </section>
            <section class="np-posts">
                <article class="np-post">
                    <h2>Sample Post</h2>
                    <p>This is a static demonstration post for preview purposes.</p>
                </article>
            </section>
        </main>
        <footer class="np-footer">
            <span>Powered by Tumblr</span>
            <span class="np-legal">IRI National d/b/a Luv Media Group</span>
        </footer>
    </body>
</html>
